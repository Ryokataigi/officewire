name: Update news

on:
  schedule:
    - cron: "13 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Fetch news and summarize
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch-news

      - name: Commit and push if changed
        run: |
          git config user.name "officewire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/articles.json
          git diff --staged --quiet || git commit -m "Update news $(date -u +%Y-%m-%d)"
          git push
