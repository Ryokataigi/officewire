<!DOCTYPE html>
<html lang="ja" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfficeWire — 世界のオフィスニュース</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-top">
    <div class="logo-block">
      <div class="logo">Office<span>Wire</span></div>
      <div class="tagline" id="header-tagline"></div>
    </div>
    <div class="masthead-actions">
      <span id="today"></span>
      <select id="lang-switcher" aria-label="Language"></select>
      <button id="mode-toggle">ダークモード</button>
    </div>
  </div>
  <div class="wrap">
    <div class="ticker-strip" id="ticker-strip"></div>
  </div>
</header>

<div class="wrap">
  <div class="tabs top-tabs" id="tabs"></div>
  <div class="tabs" id="category-tabs"></div>

  <div class="layout">
    <div id="feed"></div>

    <aside class="sidebar">
      <div class="sidebar-block">
        <h4 id="categories-heading">カテゴリー</h4>
        <div id="category-list"></div>
      </div>
    </aside>
  </div>
</div>

<footer class="site-footer">
  <div class="wrap footer-grid">
    <div class="footer-col footer-brand">
      <div class="logo">Office<span>Wire</span></div>
      <p id="footer-tagline"></p>
    </div>
    <div class="footer-col">
      <h5 id="footer-sources-heading">Sources</h5>
      <div id="footer-sources"></div>
    </div>
    <div class="footer-col">
      <h5 id="footer-about-heading">About</h5>
      <p id="footer-about-text"></p>
    </div>
  </div>
  <div class="wrap footer-bottom">
    <span id="footer-copyright"></span>
  </div>
</footer>

<script src="config.js"></script>
<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
